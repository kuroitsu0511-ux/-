                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="notify-30" value="30" onchange="saveSettings()" class="rounded border-stone-300 text-amber-700"> 30分前</label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="notify-60" value="60" onchange="saveSettings()" class="rounded border-stone-300 text-amber-700"> 1時間前</label>
                        <label class="flex items-center gap-2 cursor-pointer col-span-2"><input type="checkbox" id="notify-1440" value="1440" onchange="saveSettings()" class="rounded border-stone-300 text-amber-700"> 1日前 (24時間前)</label>

            <button onclick="closeSettingsModal()" class="w-full mt-6 bg-amber-700 text-white py-3 rounded-xl font-bold text-xs hover:bg-amber-600 transition shadow-sm active:scale-95">
                設定を保存して閉じる

    <script>
        const ONESIGNAL_APP_ID = "55346b44-31db-4008-be1f-1e9c0d107bae";
        const ONESIGNAL_REST_API_KEY = "os_v2_app_ku2gwrbr3naarpq7d2oa2ed3vzlofroyoleuqgmqhe7qr74mnjhct6dhgli3savmjix7nzzirq5wb4hqbjzrwmigywlc64deigkorna";
        
        let swRegistration = null;
        window.onesignalSubscriptionId = null;

        // Service Worker の登録 (PWA & バックグラウンド用)
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl)
                .then(async reg => {
                    swRegistration = reg;
                })
                .catch(err => console.log('SW registration failed:', err));
        }

        let appSettings = {
            autoClean: 'never',
            defaultNotifications: [60, 10, 0]
        };

        let currentCalendarDate = new Date();
        let selectedCalendarDateStr = null;
        let computedFreeTimes = [];

        let recognition = null;
        let isRecognizing = false;

        let events = [
            {
                id: '1',
                title: '✂️ ヘアサロン',
                category: 'beauty',
                start: '2026-09-20T14:00',
                end: '2026-09-20T15:00',
                memo: '美容院でカットする',
                repeat: 'none',
                advice: '💡 なりたい髪型の参考画像を用意しておくとオーダーがスムーズです！',
                weatherAdvice: '☀️ 快晴予定です。お出かけにぴったりの天気です！',
                notificationTimings: [60, 10, 0],
                notifiedList: []
            }
        ];

        const categoryStyles = {
            work: { name: '仕事・勉強', bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-700', badge: 'bg-blue-600 text-white', eventBg: 'bg-blue-100 text-blue-900 border-blue-200' },
            beauty: { name: '美容・生活', bg: 'bg-pink-50', border: 'border-pink-200', text: 'text-pink-700', badge: 'bg-pink-600 text-white', eventBg: 'bg-pink-100 text-pink-900 border-pink-200' },
            health: { name: '健康・通院', bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', badge: 'bg-emerald-600 text-white', eventBg: 'bg-emerald-100 text-emerald-900 border-emerald-200' },
            hobby: { name: '趣味・お出かけ', bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-700', badge: 'bg-amber-600 text-white', eventBg: 'bg-amber-100 text-amber-900 border-amber-200' }
        };

        window.onload = function() {
            appendChatMessage("どんな予定を入れる？（例:「明日の14時にカフェ」「毎週火曜19時に塾」）", "ai");
            renderEvents();
            calculateFreeTime();
            renderCalendar();
            updateClock();

            const today = new Date();
            const pad = n => String(n).padStart(2, '0');
            const todayStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
            selectCalendarDate(todayStr);
        };

        // OneSignal Web Push 有効化処理
        async function enableWebPushNotification() {
            if (!window.OneSignalDeferred) {
                showNotification('エラー', 'OneSignal SDK の読み込みに失敗しました。ページを再読み込みしてください。', '⚠️', false);
                return;
            }

            window.OneSignalDeferred.push(async function(OneSignal) {
                try {
                    await OneSignal.Notifications.requestPermission();
                    const subscriptionId = OneSignal.User?.PushSubscription?.id;
                    
                    if (subscriptionId) {
                        window.onesignalSubscriptionId = subscriptionId;
                        console.log("OneSignal Subscription ID:", subscriptionId);
                        showNotification('🔔 OneSignal 設定完了！', 'Web Push 通知が有効化されました！アプリを閉じていても予約通知が届きます。', '✅', true);
                    } else {
                        showNotification('🔔 通知設定完了', 'ブラウザの通知許可を受け取りました。', '✅', true);
                    }
                } catch (err) {
                    console.error('OneSignal permission error:', err);
                    showNotification('エラー', 'Web Push の設定中にエラーが発生しました。', '⚠️', false);
                }
            });
        }

        // OneSignal REST API による指定日時での自動予約通知
        async function scheduleOneSignalPushNotification(title, eventStartISO, minutesBefore = 10) {
            const subId = window.onesignalSubscriptionId;
            if (!subId) return;

            const eventTime = new Date(eventStartISO).getTime();
            const notifyTime = new Date(eventTime - (minutesBefore * 60 * 1000));
            if (notifyTime <= new Date()) return;

            const payload = {
                app_id: ONESIGNAL_APP_ID,
                include_subscription_ids: [subId],
                headings: { ja: "⏰ 予定のリマインド" },
                contents: { ja: `${minutesBefore > 0 ? minutesBefore + '分後に' : 'まもなく'}「${title}」の予定があります！` },
                send_after: notifyTime.toString()
            };

            try {
                const response = await fetch("https://onesignal.com/api/v1/notifications", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json; charset=utf-8",
                        "Authorization": `Basic ${ONESIGNAL_REST_API_KEY}`
                    },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                console.log("OneSignal Push 予約結果:", result);
            } catch (err) {
                console.error("OneSignal Push 予約エラー:", err);
            }
        }

        function sendOSNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                if (swRegistration && swRegistration.showNotification) {
                    swRegistration.showNotification(title, {
                        body: body,
                        icon: 'https://placehold.co/192x192/4f46e5/ffffff?text=📅',
                        badge: 'https://placehold.co/192x192/4f46e5/ffffff?text=📅',
                        vibrate: [200, 100, 200]
                    });
                } else {
                    new Notification(title, { body: body, icon: 'https://placehold.co/192x192/4f46e5/ffffff?text=📅' });
                }
            }
        }

        function showNotification(title, message, icon = '🔔', triggerOS = true) {
            const titleEl = document.getElementById('modalTitle');
            const msgEl = document.getElementById('modalMessage');
            const iconEl = document.getElementById('modalIcon');
            const modal = document.getElementById('notificationModal');
            
            if (titleEl) titleEl.innerText = title;
            if (msgEl) msgEl.innerText = message;
            if (iconEl) iconEl.innerText = icon;
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }

            if (triggerOS) {
                sendOSNotification(title, message);
            }
        }

        function closeModal() {
            const modal = document.getElementById('notificationModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function openSettingsModal() {
            const autoCleanEl = document.getElementById('settingAutoClean');
            const settingsModal = document.getElementById('settingsModal');

            if (autoCleanEl) autoCleanEl.value = appSettings.autoClean;
            const defaults = appSettings.defaultNotifications || [60, 10, 0];
            [0, 10, 30, 60, 1440].forEach(val => {
                const el = document.getElementById(`notify-${val}`);
                if (el) el.checked = defaults.includes(val);
            });
            if (settingsModal) {
                settingsModal.classList.remove('hidden');
                settingsModal.classList.add('flex');
            }
        }

        function closeSettingsModal() {
            const settingsModal = document.getElementById('settingsModal');
            if (settingsModal) {
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
            }
        }

        function exportIcsCalendar() {
            if (events.length === 0) {
                showNotification('書き出し対象なし', '登録されている予定がありません。予定を追加してから出力してください。', '💡', false);
                return;
            }

            let icsContent = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//AI Smart Scheduler//NONSGML v1.0//JA\r\nCALSCALE:GREGORIAN\r\n";

            const today = new Date();
            const pad = n => String(n).padStart(2, '0');
            const todayStr = `${today.getFullYear()}${pad(today.getMonth()+1)}${pad(today.getDate())}`;

            icsContent += "BEGIN:VEVENT\r\n";
            icsContent += `SUMMARY:🔔 【日課】今日の予定チェック\r\n`;
            icsContent += `DESCRIPTION:スケジューラーを開いて本日のタスクと空き時間を確認しましょう！\r\n`;
            icsContent += `DTSTART:${todayStr}T080000\r\n`;
            icsContent += `DTEND:${todayStr}T081500\r\n`;
            icsContent += "RRULE:FREQ=DAILY\r\n";
            icsContent += "BEGIN:VALARM\r\nTRIGGER:-PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:毎日の定時リマインダー\r\nEND:VALARM\r\n";
            icsContent += "END:VEVENT\r\n";

            events.forEach(ev => {
                const startDate = new Date(ev.start);
                const endDate = new Date(ev.end);
                
                const startFormatted = startDate.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                const endFormatted = endDate.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

                icsContent += "BEGIN:VEVENT\r\n";
                icsContent += `SUMMARY:${ev.title}\r\n`;
                icsContent += `DESCRIPTION:${ev.memo || ''}\r\n`;
                icsContent += `DTSTART:${startFormatted}\r\n`;
                icsContent += `DTEND:${endFormatted}\r\n`;
                
                if (ev.repeat === 'weekly') icsContent += "RRULE:FREQ=WEEKLY\r\n";
                if (ev.repeat === 'monthly') icsContent += "RRULE:FREQ=MONTHLY\r\n";

                (ev.notificationTimings || [10]).forEach(mins => {
                    icsContent += `BEGIN:VALARM\r\nTRIGGER:-PT${mins}M\r\nACTION:DISPLAY\r\nDESCRIPTION:リマインダー\r\nEND:VALARM\r\n`;
                });

                icsContent += "END:VEVENT\r\n";
            });

            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', 'scheduler_events.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showNotification('📅 .icsをダウンロードしました', 'ダウンロードされたファイルをタップして、iPhoneの「カレンダー」やAndroidの「Googleカレンダー」に保存してください。アプリを終了していてもOSから定時通知が届きます！', '✅', false);
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;

            const rec = new SpeechRecognition();
            rec.lang = 'ja-JP';
            rec.continuous = false;
            rec.interimResults = true;

            rec.onstart = function() {
                isRecognizing = true;
                updateMicUI(true);
            };

            rec.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                const inputEl = document.getElementById('userInput');
                if (inputEl) inputEl.value = transcript;
            };

            rec.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                isRecognizing = false;
                updateMicUI(false);
                showNotification('🎙️ 音声入力エラー', '音声認識でエラーが発生しました: ' + event.error, '⚠️', false);
            };

            rec.onend = function() {
                isRecognizing = false;
                updateMicUI(false);
            };

            return rec;
        }

        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showNotification('非対応ブラウザ', 'お使いのブラウザは音声入力に対応していません。', '⚠️', false);
                return;
            }

            if (!recognition) {
                recognition = initSpeechRecognition();
            }

            if (isRecognizing) {
                if (recognition) recognition.stop();
            } else {
                try {
                    if (recognition) recognition.start();
                } catch(e) {
                    console.error('Recognition start error:', e);
                }
            }
        }

        function checkNotifications() {
            const now = new Date();
            events.forEach(ev => {
                if (!ev.notifiedList) ev.notifiedList = [];
                const startTime = new Date(ev.start);
                
                (ev.notificationTimings || []).forEach(timingMinutes => {
                    const notifyTime = new Date(startTime.getTime() - timingMinutes * 60 * 1000);
                    const diffSec = (now - notifyTime) / 1000;
                    const timingKey = `${timingMinutes}m`;
                    
                    if (diffSec >= 0 && diffSec < 60 && !ev.notifiedList.includes(timingKey)) {
                        ev.notifiedList.push(timingKey);

        function cleanExpiredEvents() {
            if (appSettings.autoClean === 'never') return;
            const now = new Date();
            events = events.filter(ev => {
                const endDate = new Date(ev.end);
                const diffHours = (now - endDate) / (1000 * 60 * 60);
                if (appSettings.autoClean === 'immediately') return endDate > now;
                if (appSettings.autoClean === '24h') return diffHours < 24;
                if (appSettings.autoClean === '7d') return diffHours < (24 * 7);
                return true;
            });
        }

        function smartLocalParser(text) {
            let now = new Date();
            let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            let normalizedText = text.replace(/[！-～]/g, function(s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            });

            let repeat = 'none';
            if (/毎週/.test(normalizedText)) repeat = 'weekly';
            else if (/毎月/.test(normalizedText)) repeat = 'monthly';

            const dayOfWeekMap = { '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6 };
            const dayMatch = normalizedText.match(/(今週|来週|再来週|毎週)?\s*([日日月火水木金土])曜(?:日)?/);

            if (dayMatch) {
                const prefix = dayMatch[1] || '';
                const targetDay = dayOfWeekMap[dayMatch[2]];
                const currentDay = now.getDay();
                
                let daysToAdd = (targetDay - currentDay + 7) % 7;
                if (daysToAdd === 0 && (prefix === '来週' || normalizedText.includes('来週'))) {
                    daysToAdd = 7;
                } else if (prefix === '来週') {
                    daysToAdd += 7;
                } else if (prefix === '再来週') {
                    daysToAdd += 14;
                }

                targetDate.setDate(now.getDate() + daysToAdd);
                if (prefix === '毎週' || normalizedText.includes('毎週')) {
                    repeat = 'weekly';
                }
            } else if (normalizedText.includes('明日')) {
                targetDate.setDate(now.getDate() + 1);
            } else if (normalizedText.includes('明後日')) {
                targetDate.setDate(now.getDate() + 2);
            }

            let hour = 12; 
            let minute = 0;
            const timeMatch = normalizedText.match(/(\d{1,2})(?:時|:)(\d{1,2}|半)?/);
            
            if (timeMatch) {
                hour = parseInt(timeMatch[1], 10);
                const isNightExplicit = /午後|夜|夕方|晩|深夜|夜中/.test(normalizedText);
                const isMorningExplicit = /午前|朝|早朝/.test(normalizedText);
                const isNightActivity = /飲み会|ディナー|バー|居酒屋/.test(normalizedText);

                if (hour < 12) {
                    if (isNightExplicit || isNightActivity) {
                        hour += 12;
                    } else if (!isMorningExplicit) {
                        if (hour >= 1 && hour <= 6) hour += 12;
                    }
                }
                
                if (timeMatch[2] === '半') minute = 30;
                else if (timeMatch[2]) minute = parseInt(timeMatch[2], 10);
            }
            targetDate.setHours(hour, minute, 0, 0);

            const presets = [
                { kw: '美容院', title: '✂️ ヘアサロン', cat: 'beauty', advice: '💡 なりたい髪型の参考画像を用意しておくとスムーズ！', weather: '☀️ 帰りはお出かけ日和の予感です！' },
                { kw: 'カフェ', title: '☕️ カフェタイム', cat: 'hobby', advice: '💡 席の予約が可能か事前にチェックしておきましょう！', weather: '' },
                { kw: '歯医者', title: '🦷 デンタルクリニック', cat: 'health', advice: '💡 保険証・診察券・お薬手帳をお忘れなく！', weather: '🌂 折りたたみ傘があると安心な気候です。' },
                { kw: '会議', title: '💼 ミーティング', cat: 'work', advice: '💡 アジェンダと資料の事前共有を確認！', weather: '' },
                { kw: '塾', title: '✏️ 塾・スクール', cat: 'work', advice: '💡 テキストと筆記用具を準備して行きましょう！', weather: '' }
            ];

            let title = '';
            let category = 'hobby';
            let advice = '💡 予定に合わせて忘れ物のないようチェックしましょう！';
            let weatherAdvice = '🌦️ 最新の天気予報もチェックしておきましょう！';

            let found = presets.find(p => text.includes(p.kw));
            if (found) {
                title = found.title;
                category = found.cat;
                advice = found.advice;
                if (found.weather) weatherAdvice = found.weather;
            } else {
                let cleanTitle = text.replace(/今日|明日|明後日|来週|毎週|毎月/g, '')
                                     .replace(/\d{1,2}時(\d{1,2}分|半)?/g, '')
                                     .replace(/通知(は)?(いらない|なし|不要|して|教えて)?/g, '')
                                     .trim();
                title = "📌 " + (cleanTitle.substring(0, 12) || "予定");
            }

            let notificationTimings = [];
            if (/通知(は)?(いらない|なし|不要)/.test(normalizedText)) {
                notificationTimings = [];
            } else {
                if (/ちょうど|ぴったり|0分前/.test(normalizedText)) notificationTimings.push(0);
                const matches = [...normalizedText.matchAll(/(\d{1,3})\s*(分|時間|日)前/g)];
                matches.forEach(m => {
                    let val = parseInt(m[1], 10);
                    if (m[2] === '時間') val *= 60;
                    if (m[2] === '日') val *= 1440;
                    if (!notificationTimings.includes(val)) notificationTimings.push(val);
                });
                if (notificationTimings.length === 0) {
                    notificationTimings = [...(appSettings.defaultNotifications || [60, 10, 0])];
                }
            }

            const pad = (n) => String(n).padStart(2, '0');
            const startStr = `${targetDate.getFullYear()}-${pad(targetDate.getMonth()+1)}-${pad(targetDate.getDate())}T${pad(targetDate.getHours())}:${pad(targetDate.getMinutes())}`;
            targetDate.setHours(targetDate.getHours() + 1);
            const endStr = `${targetDate.getFullYear()}-${pad(targetDate.getMonth()+1)}-${pad(targetDate.getDate())}T${pad(targetDate.getHours())}:${pad(targetDate.getMinutes())}`;

            return {
                title: title,
                category: category,
                start_time: startStr,
                end_time: endStr,
                memo: text,
                repeat: repeat,
                advice: advice,
                weatherAdvice: weatherAdvice,
                notification_timings: notificationTimings
            };
        }

        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);

        function getEventsForDate(dateStr) {
            const target = new Date(dateStr + 'T00:00:00');
            return events.filter(ev => {
                const evStart = new Date(ev.start.split('T')[0] + 'T00:00:00');
                if (target < evStart) return false;

                if (ev.repeat === 'weekly') {
                    return target.getDay() === evStart.getDay();
                } else if (ev.repeat === 'monthly') {
                    return target.getDate() === evStart.getDate();
                } else {
                    return ev.start.startsWith(dateStr);
                }
            });
        }

        function calculateFreeTime() {
            const now = new Date();
            const workingHours = { start: 9, end: 22 };
            computedFreeTimes = [];

            for (let i = 0; i < 7; i++) {
                let target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
                const pad = n => String(n).padStart(2, '0');
                const dateStr = `${target.getFullYear()}-${pad(target.getMonth()+1)}-${pad(target.getDate())}`;
                
                const dayEvents = getEventsForDate(dateStr).map(ev => {
                    const s = new Date(ev.start);
                    const e = new Date(ev.end);
                    s.setFullYear(target.getFullYear(), target.getMonth(), target.getDate());
                    e.setFullYear(target.getFullYear(), target.getMonth(), target.getDate());
                    return { start: s, end: e };
                }).sort((a, b) => a.start - b.start);

                let currentTime = new Date(target);
                currentTime.setHours(workingHours.start, 0, 0, 0);
                const endTime = new Date(target);
                endTime.setHours(workingHours.end, 0, 0, 0);

                if (i === 0 && now > currentTime) {
                    currentTime = new Date(now);
                    currentTime.setMinutes(Math.ceil(currentTime.getMinutes() / 30) * 30, 0, 0);
                }

                let dailyFreeBlocks = [];

                for (let ev of dayEvents) {
                    if (ev.end <= currentTime) continue;
                    if (ev.start >= endTime) break;

                    if (currentTime < ev.start) {
                        const diffMins = (ev.start - currentTime) / (1000 * 60);
                        if (diffMins >= 60) {
                            dailyFreeBlocks.push({ start: new Date(currentTime), end: new Date(ev.start) });
                        }
                    }
                    currentTime = ev.end > currentTime ? ev.end : currentTime;
                }

                if (currentTime < endTime) {
                    const diffMins = (endTime - currentTime) / (1000 * 60);
                    if (diffMins >= 60) {
                        dailyFreeBlocks.push({ start: new Date(currentTime), end: new Date(endTime) });
                    }
                }
                
                if (dailyFreeBlocks.length > 0) {
                     computedFreeTimes.push({ dateStr: dateStr, dateObj: target, blocks: dailyFreeBlocks });
                }
            }
            renderFreeTimeList();
        }

        function formatTime(dateObj) {
            return `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
        }
        
        function getDayStr(dateObj) {
            return ['日','月','火','水','木','金','土'][dateObj.getDay()];
        }

        function renderFreeTimeList() {
            const freeEl = document.getElementById('freeTimeList');
            if (!freeEl) return;
            if (computedFreeTimes.length === 0) {
                freeEl.innerHTML = `<div class="text-[11px] text-stone-500 p-2 text-center">直近1週間にまとまった空き時間が見つかりません。</div>`;
                return;
            }

            let html = '';
            let count = 0;
            for (let day of computedFreeTimes) {
                for (let block of day.blocks) {
                    if (count >= 3) break;
                    const timeStr = `${formatTime(block.start)} - ${formatTime(block.end)}`;
                    const label = block.start.getHours() < 12 ? '午前' : (block.start.getHours() < 17 ? '午後' : '夜');
                    
                    html += `
                        <div class="bg-amber-50/50 border border-amber-100 p-2 rounded-lg flex justify-between items-center text-[11px] mb-1.5">
                            <span class="text-amber-900 font-medium">${day.dateObj.getMonth()+1}/${day.dateObj.getDate()}(${getDayStr(day.dateObj)}) ${label} (${timeStr})</span>
                            <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px] shrink-0">空き時間</span>
                        </div>
                    `;
                    count++;
                }
                if (count >= 3) break;
            }
            freeEl.innerHTML = html;
        }

        function copyFreeTimeForLine() {
            if (computedFreeTimes.length === 0) {
                showNotification('空き時間がありません', '直近1週間にコピーできる空き時間が見つかりませんでした。', '⚠️', false);
                return;
            }

            let lineText = `近日の空き時間だよ！都合いいところ教えてね〜😊\n\n`;
            let count = 0;
            
            for (let day of computedFreeTimes) {
                for (let block of day.blocks) {
                    if (count >= 5) break;
                    const timeStr = `${formatTime(block.start)} - ${formatTime(block.end)}`;
                    const label = block.start.getHours() < 12 ? '午前' : (block.start.getHours() < 17 ? '午後' : '夜');
                    lineText += `・${day.dateObj.getMonth()+1}/${day.dateObj.getDate()}(${getDayStr(day.dateObj)}) ${label} (${timeStr})\n`;
                    count++;
                }
            }
            lineText += `\nよろしく！✨`;

            const textArea = document.createElement('textarea');
            textArea.value = lineText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            showNotification('💬 コピー完了！', 'LINE送信用の空き時間メッセージをコピーしました！', '✅', false);
        }

        function renderCalendar() {
            const gridEl = document.getElementById('calendarGrid');
            const titleEl = document.getElementById('calendarMonthTitle');
            if (!gridEl || !titleEl) return;

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            titleEl.innerText = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const pad = n => String(n).padStart(2, '0');

            let html = '';

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="min-h-[72px] bg-stone-100/30 rounded-lg p-1 border border-stone-200/40 opacity-30"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${pad(month + 1)}-${pad(day)}`;
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
                const isSelected = selectedCalendarDateStr === dateStr;
                const dayEvents = getEventsForDate(dateStr);

                let cellClass = "min-h-[72px] bg-white rounded-lg p-1 border cursor-pointer transition flex flex-col justify-between overflow-hidden relative ";
                if (isSelected) {
                    cellClass += "border-amber-700 bg-amber-50/50 shadow-xs ring-1 ring-amber-700/50 ";
                } else if (isToday) {
                    cellClass += "border-amber-500 bg-amber-50/30 ";
                } else {
                    cellClass += "border-stone-200 hover:border-amber-300 ";
                }

                let eventsHtml = '';
                const displayEvents = dayEvents.slice(0, 2);
                
                displayEvents.forEach(ev => {
                    const catStyle = categoryStyles[ev.category] || categoryStyles.hobby;
                    eventsHtml += `
                        <div class="text-[9px] truncate px-1 py-0.5 rounded ${catStyle.eventBg} font-medium leading-tight border border-stone-200/50 shadow-2xs">
                            ${ev.title}
                        </div>
                    `;
                });

                if (dayEvents.length > 2) {
                    eventsHtml += `<div class="text-[8px] text-stone-500 font-bold px-0.5 text-right">+${dayEvents.length - 2}件</div>`;
                }

                html += `
                    <div onclick="selectCalendarDate('${dateStr}')" class="${cellClass}">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="text-[10px] font-bold ${isToday ? 'bg-amber-600 text-white w-4 h-4 rounded-full flex items-center justify-center' : 'text-stone-700'}">${day}</span>
                            ${dayEvents.length > 0 ? '<span class="w-1.5 h-1.5 rounded-full bg-amber-600"></span>' : ''}
                        </div>
                        <div class="flex-1 flex flex-col gap-0.5 justify-start overflow-hidden">
                            ${eventsHtml}
                        </div>
                    </div>
                `;
            }

            gridEl.innerHTML = html;
        }

        function changeMonth(delta) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
            renderCalendar();
        }

        function selectCalendarDate(dateStr) {
            selectedCalendarDateStr = dateStr;
            renderCalendar();

            const titleEl = document.getElementById('selectedDateTitle');
            const eventsEl = document.getElementById('selectedDateEvents');
            if (!titleEl || !eventsEl) return;

            const [y, m, d] = dateStr.split('-');
            titleEl.innerText = `${y}年${parseInt(m, 10)}月${parseInt(d, 10)}日の予定`;

            const dayEvents = getEventsForDate(dateStr);
            if (dayEvents.length === 0) {
                eventsEl.innerHTML = `<p class="text-stone-400 text-[11px]">予定はありません。</p>`;
                return;
            }

            eventsEl.innerHTML = dayEvents.map(ev => {
                const catStyle = categoryStyles[ev.category] || categoryStyles.hobby;
                return `
                    <div class="bg-white border ${catStyle.border} p-2 rounded-lg flex justify-between items-center text-xs shadow-xs">
                        <div>
                            <span class="font-bold text-stone-900">${ev.title}</span>
                            <div class="text-[10px] ${catStyle.text} mt-0.5 font-medium">⏰ ${ev.start.split('T')[1]}</div>
                        </div>
                        <button onclick="deleteEvent('${ev.id}')" class="text-stone-400 hover:text-rose-600 text-[10px] px-2 py-1 bg-stone-100 rounded">削除</button>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
